# =============================================================================
# Lakshmi Q2 — Nginx Reverse Proxy Configuration
#
# Rutas:
#   /api/*        → backend:5000
#   /socket.io/*  → backend:5000 (con WebSocket upgrade)
#   /*            → frontend SPA (fallback a index.html)
# =============================================================================

upstream backend {
    server backend:5000;
}

server {
    listen 80;
    server_name localhost;

    # ── Tamaño máximo de request body ────────────────────────────
    client_max_body_size 10M;

    # ── Proxy para API REST ──────────────────────────────────────
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts generosos para operaciones de yfinance
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Proxy para WebSocket (Flask-SocketIO) ────────────────────
    location /socket.io/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Headers para WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout largo para conexiones WebSocket persistentes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Frontend SPA (fallback a index.html) ─────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Compresión gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
}
